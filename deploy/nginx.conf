# Legacy compat: the flag was briefly named garden-entered (hyphen), which
# $cookie_ variables cannot address. Match it from the raw header instead.
map $http_cookie $legacy_entered {
    default 0;
    ~*garden-entered= 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Returning visitors get the real app at /, proxied transparently:
    # either they hold our splash flag (garden_entered — underscore: nginx
    # variables cannot contain hyphens) or ANY app session (PHPSESSID).
    # First-timers get the splash. The app itself is never modified and
    # owns every other path via its own Traefik router.
    location = / {
        set $to_app "";
        if ($cookie_garden_entered) { set $to_app 1; }
        if ($cookie_phpsessid)     { set $to_app 1; }
        if ($legacy_entered)       { set $to_app 1; }
        if ($to_app) { rewrite ^ /_app last; }
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location = /index.html {
        set $to_app "";
        if ($cookie_garden_entered) { set $to_app 1; }
        if ($cookie_phpsessid)     { set $to_app 1; }
        if ($legacy_entered)       { set $to_app 1; }
        if ($to_app) { rewrite ^ /_app last; }
        add_header Cache-Control "no-store" always;
    }

    location = /_app {
        internal;
        proxy_pass http://192.168.50.241:8123/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Rebuilt nightly by deploy/bake.py: always revalidate. Photos are
    # content-named, so they can cache for a week without going stale.
    location = /plants.local.js {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/photos/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# garden.silverwulf.org — the same welcome page in front of The Garden
# dashboard, for signed-out visitors only. Traefik (hortusfox-gate.yml,
# router garden-gate) sends / here only when there is no garden_session
# cookie; signed-in visitors go straight to the dashboard. Nothing in this
# block proxies anywhere, and the HortusFox cookie hand-off above does not
# apply: a garden_entered cookie must never show HortusFox on this host.
server {
    listen 80;
    server_name garden.silverwulf.org;
    root /usr/share/nginx/html;

    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location = /plants.local.js {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/photos/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
