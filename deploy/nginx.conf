server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The splash is an entry door, not a cached artifact — Cloudflare and
    # browsers must always re-check it, or a stale page hides app changes.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location = / {
        add_header Cache-Control "no-store" always;
    }

    location /assets/photos/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
