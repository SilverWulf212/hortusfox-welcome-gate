<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Garden — plants.silverwulf.org</title>
<meta name="description" content="A quiet place for growing things.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234a4d44'/%3E%3Cpath d='M16 26V14' stroke='%23eef1e7' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M16 17c0-4 2.8-6.6 6.6-6.4.4 4-2.6 6.9-6.6 6.4Z' fill='%23c9d8a5'/%3E%3Cpath d='M16 19c-.2-3.4-2.6-5.6-5.8-5.6-.2 3.4 2.2 5.7 5.8 5.6Z' fill='%23eef1e7'/%3E%3C/svg%3E">
<script>document.documentElement.className += " js";</script>
<style>
  :root{
    --ink:        #f2f3ef;
    --ink-soft:   rgba(242,243,239,.66);
    --ink-faint:  rgba(242,243,239,.42);
    --rule:       rgba(255,255,255,.06);
    --card:       #f2f3ef;
    --card-ink:   #23261f;
    --card-label: #7c8177;
    --moss:       #c9d8a5;
    --moss-deep:  #8fae62;
    --ease:       cubic-bezier(.22,.61,.36,1);
    --ease-out:   cubic-bezier(.16,1,.3,1);
  }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

  html{ background:#383b34; }
  body{
    font-family:'Lexend','Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif;
    font-weight:300;
    color:var(--ink);
    background:#383b34;
    min-height:100svh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .hero{
    position:relative;
    width:100%;
    min-height:100svh;
    overflow:hidden;
    isolation:isolate;
    background:
      radial-gradient(64% 52% at 27% 84%, rgba(232,238,222,.085) 0%, rgba(232,238,222,0) 72%),
      radial-gradient(70% 60% at 92% 8%,  rgba(24,28,20,.10) 0%, rgba(24,28,20,0) 68%),
      #4a4d44;
  }
  .hero::after{
    content:'';
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(72% 44% at 50% 117%, rgba(238,243,231,.42) 0%, rgba(238,243,231,.18) 42%, rgba(238,243,231,.04) 72%, rgba(238,243,231,0) 88%),
      linear-gradient(180deg, rgba(238,243,231,0) 54%, rgba(238,243,231,.05) 100%);
  }

  #pollen{ position:absolute; inset:0; z-index:1; pointer-events:none; opacity:.85; }

  .guides{ position:absolute; inset:0; z-index:1; pointer-events:none; }
  .guides i{
    position:absolute; top:0; bottom:0; width:1px;
    background:linear-gradient(180deg, transparent 0%, var(--rule) 12%, var(--rule) 78%, transparent 100%);
  }
  .guides i:nth-child(1){ left:25%; } .guides i:nth-child(2){ left:50%; } .guides i:nth-child(3){ left:75%; }

  .ghost{
    position:absolute; z-index:1; left:-.02em; bottom:-.21em;
    font-size:min(24vw,340px); line-height:.8; font-weight:400;
    letter-spacing:.08em; color:rgba(255,255,255,.05);
    white-space:nowrap; user-select:none; pointer-events:none;
  }

  /* ── floating dock ─────────────────────────────────────────────────── */
  .dock-wrap{
    position:absolute; z-index:6; top:clamp(16px,4vh,38px); left:0; right:0;
    display:flex; justify-content:center; pointer-events:none;
  }
  .dock{
    pointer-events:auto;
    display:flex; align-items:center; gap:3px;
    height:46px; padding:5px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.11);
    background:
      linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,0) 42%),
      rgba(34,40,31,.74);
    box-shadow:0 8px 22px rgba(10,14,8,.30), inset 0 1px rgba(255,255,255,.06);
  }
  .dock a{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    height:36px; padding:0 13px;
    border:1px solid transparent; border-radius:10px;
    background:rgba(255,255,255,.04);
    color:var(--ink-faint); text-decoration:none;
    font-size:11px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase;
    white-space:nowrap;
    transition:color .18s var(--ease), border-color .2s var(--ease), background .2s var(--ease), transform .25s var(--ease-out);
  }
  .dock a:hover{ color:var(--ink); border-color:rgba(255,255,255,.19); background:rgba(31,37,28,.94); transform:translateY(-1px); }
  .dock a:focus-visible{ outline:2px solid rgba(255,255,255,.85); outline-offset:2px; }
  .dock svg{ width:15px; height:15px; flex:none; fill:none; stroke:currentColor; stroke-width:1.25; stroke-linecap:round; stroke-linejoin:round; }
  .dock-mark{
    width:36px; padding:0;
    background:#eef1e7; border-color:#eef1e7; color:#23261f; overflow:hidden;
  }
  .dock-mark svg{ width:58%; height:58%; fill:currentColor; stroke:none; }
  @media (max-width:640px){ .dock a span:not(.glyph){ display:none; } .dock a{ width:40px; padding:0; } }

  /* ── copy ──────────────────────────────────────────────────────────── */
  .copy{
    position:relative; z-index:4;
    max-width:1200px; margin:0 auto;
    padding:calc(clamp(90px,20vh,190px)) clamp(24px,5vw,56px) 0;
  }
  .headline{
    font-size:clamp(38px,5.2vw,63px);
    line-height:1.04; letter-spacing:-.01em; font-weight:300;
  }
  .headline span{ display:block; padding-bottom:.04em; }
  .lede{
    margin-top:clamp(20px,4vh,40px);
    max-width:230px;
    margin-left:min(30vw,480px);
    font-size:clamp(14px,1.3vw,16.5px); line-height:1.45; color:var(--ink-soft);
  }
  @media (max-width:900px){ .lede{ margin-left:0; max-width:420px; } }

  .stats{ display:flex; flex-wrap:wrap; gap:clamp(28px,6vw,90px); margin-top:clamp(28px,6vh,54px); }
  .stat{ display:flex; align-items:flex-start; gap:10px; }
  .stat .mark{ width:30px; height:30px; flex:none; margin-top:2px; color:rgba(255,255,255,.34); }
  .stat .mark svg{ width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.2; stroke-linecap:round; }
  .stat dt{ font-size:13px; color:var(--ink-soft); line-height:1.35; }
  .stat dd{ font-size:14px; font-weight:600; line-height:1.5; }
  .stat dd .live{ color:var(--moss); }

  /* ── CTA ───────────────────────────────────────────────────────────── */
  .cta-row{ margin-top:clamp(30px,6vh,58px); display:flex; align-items:center; gap:26px; flex-wrap:wrap; }
  .cta{
    position:relative; display:inline-flex; align-items:center; gap:14px;
    padding:17px 30px;
    border-radius:999px; border:1px solid rgba(255,255,255,.14);
    background:
      linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.015) 48%),
      rgba(20,25,17,.55);
    box-shadow:0 12px 30px rgba(10,14,8,.35), inset 0 1px rgba(255,255,255,.12);
    color:var(--ink); text-decoration:none;
    font-size:14px; font-weight:500; letter-spacing:.4px;
    overflow:hidden;
    transition:transform .35s var(--ease-out), box-shadow .35s var(--ease), border-color .3s;
  }
  .cta::before{
    content:''; position:absolute; top:0; bottom:0; width:44%; left:-30%;
    background:linear-gradient(100deg,transparent,rgba(240,246,220,.16) 40%,rgba(252,255,246,.34) 52%,transparent);
    transform:skewX(-14deg);
    animation:sheen 4.6s var(--ease) infinite;
  }
  @keyframes sheen{ 0%,55%{ left:-30%; } 80%,100%{ left:120%; } }
  .cta:hover{ transform:translateY(-2px); border-color:rgba(201,216,165,.45); box-shadow:0 18px 40px rgba(10,14,8,.45), inset 0 1px rgba(255,255,255,.16); }
  .cta:focus-visible{ outline:2px solid rgba(255,255,255,.85); outline-offset:3px; }
  .cta svg{ width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; transition:transform .3s var(--ease-out); }
  .cta:hover svg{ transform:translateX(4px); }

  .hint{ font-size:12px; letter-spacing:2.4px; text-transform:uppercase; color:var(--ink-faint); }

  /* ── entrance choreography ─────────────────────────────────────────── */
  .js .rise{ opacity:0; transform:translateY(14px); }
  .is-ready .rise{
    opacity:1; transform:none;
    transition:opacity .9s var(--ease) var(--d,0ms), transform 1.15s var(--ease-out) var(--d,0ms);
  }
  .js .fade-in{ opacity:0; }
  .is-ready .fade-in{ opacity:1; transition:opacity 1.2s var(--ease) var(--d,0ms); }

  /* ── the handoff veil: pale wash that closes as you enter the app ──── */
  #veil{
    position:fixed; inset:0; z-index:60; pointer-events:none;
    background:radial-gradient(80% 70% at 50% 100%, #edf2e2, #dde5cf);
    opacity:0; transition:opacity .45s var(--ease);
  }
  body.leaving #veil{ opacity:1; }

  @media (prefers-reduced-motion:reduce){
    .js .rise,.js .fade-in{ opacity:1 !important; transform:none !important; transition:none !important; }
    .cta::before{ animation:none; display:none; }
    #pollen{ display:none; }
  }
</style>
</head>
<body>

<main class="hero" id="hero">
  <canvas id="pollen" aria-hidden="true"></canvas>

  <div class="guides fade-in" style="--d:900ms" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="ghost fade-in" style="--d:1100ms" aria-hidden="true">HORTUS</div>

  <div class="dock-wrap">
    <nav class="dock fade-in" style="--d:150ms" aria-label="Garden navigation">
      <a class="dock-mark" href="/" data-enter aria-label="The Garden — home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 27V13" stroke="#23261f" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M16 18c0-4.2 3-7 7-6.8.4 4.3-2.8 7.3-7 6.8Z"/><path d="M16 20c-.2-3.6-2.8-6-6.2-6-.2 3.7 2.4 6.1 6.2 6Z"/></svg>
      </a>
      <a href="/plants" data-enter style="--d:200ms">
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14V9"/><path d="M8 9c0-2.4 1.7-4.3 4-4.3.2 2.6-1.6 4.6-4 4.3Z"/><path d="M8 10.5C7.9 8.4 6.4 6.8 4.4 6.8 4.3 8.9 5.9 10.6 8 10.5Z"/></svg>
        <span>Plants</span>
      </a>
      <a href="/tasks" data-enter style="--d:250ms">
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-6.5"/></svg>
        <span>Tasks</span>
      </a>
      <a href="/calendar" data-enter style="--d:300ms">
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="10" rx="1.5"/><path d="M2.5 6.5h11M5.5 2v2.5M10.5 2v2.5"/></svg>
        <span>Calendar</span>
      </a>
    </nav>
  </div>

  <div class="copy">
    <h1 class="headline">
      <span class="rise" style="--d:260ms">Step into</span>
      <span class="rise" style="--d:380ms">the living garden.</span>
    </h1>

    <p class="lede rise mask" style="--d:520ms">Every plant has a story, a place, and a turn for water. This is where we keep track of all three.</p>

    <dl class="stats">
      <div class="stat rise" style="--d:700ms">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="10.5" stroke-dasharray="0.6 3.6"/><circle cx="15" cy="15" r="5.6" stroke-dasharray="0.6 3.2"/><circle cx="15" cy="15" r="1.1" fill="currentColor" stroke="none"/></svg></span>
        <div><dt>Plants tended</dt><dd id="stat-plants">— rooted in care</dd></div>
      </div>
      <div class="stat rise" style="--d:780ms">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 30 30"><g><path d="M15 3.5v5"/><path d="M15 21.5v5"/><path d="M3.5 15h5"/><path d="M21.5 15h5"/></g><circle cx="15" cy="15" r="3.6"/></svg></span>
        <div><dt>This week</dt><dd id="stat-tasks">— things to do</dd></div>
      </div>
    </dl>

    <div class="cta-row rise" style="--d:900ms">
      <a class="cta" href="/auth?redirect=%2Findex.php" data-enter>
        Enter the garden
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></svg>
      </a>
      <span class="hint">plants.silverwulf.org</span>
    </div>
  </div>

  <div id="veil" aria-hidden="true"></div>
</main>

<script src="config.js"></script>
<script>
(function () {
  'use strict';

  var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── returning visitors skip the splash entirely ─────────────────────
     The Traefik router only hands us exactly "/", so /index.php still
     reaches the real app. Once you have entered once, the splash steps
     aside instantly and silently on every later visit to "/". */
  try {
    if (localStorage.getItem('garden-entered')) {
      location.replace('/index.php');
      return;
    }
  } catch (e) { /* private mode etc. — just show the splash */ }

  function enter() {
    try { localStorage.setItem('garden-entered', '1'); } catch (e) {}
    document.body.classList.add('leaving');
    /* let the veil finish closing before handing off */
    var go = this.getAttribute('href');
    setTimeout(function () { location.href = go; }, REDUCED ? 0 : 430);
  }
  document.querySelectorAll('[data-enter]').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); enter.call(a); });
  });

  requestAnimationFrame(function () { requestAnimationFrame(function () {
    void document.body.offsetHeight;
    document.body.classList.add('is-ready');
  }); });
  setTimeout(function () { document.body.classList.add('is-ready'); }, 1500);

  /* ── live counts from the HortusFox REST API (optional) ──────────────
     Drop a token into config.js as GARDEN_API_TOKEN (Admin → API inside
     HortusFox). Without it the poetic placeholders stay. */
  if (typeof GARDEN_API_TOKEN === 'string' && GARDEN_API_TOKEN.length > 8) {
    function hf(path, done) {
      fetch(path + '?token=' + encodeURIComponent(GARDEN_API_TOKEN), { headers: { 'Accept': 'application/json' } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) { done(j && j.data !== undefined ? j.data : j); })
        .catch(function () {});
    }
    hf('/api/plants/list', function (d) {
      var n = Array.isArray(d) ? d.length : (d && (d.total || d.count));
      if (n !== undefined) document.getElementById('stat-plants').innerHTML =
        '<span class="live">' + n + '</span> rooted in care';
    });
    hf('/api/tasks/fetch?done=0', function (d) {
      var n = Array.isArray(d) ? d.length : (d && (d.total || d.count));
      if (n !== undefined) document.getElementById('stat-tasks').innerHTML =
        '<span class="live">' + n + '</span> open tasks';
    });
  }

  /* ── pollen drift ────────────────────────────────────────────────────
     A few hundred soft motes rising through the light pool. All motion is
     derived from uTime-style phase math per frame on canvas2d; pauses when
     the tab hides, and never starts under reduced motion. */
  if (!REDUCED) (function () {
    var cv = document.getElementById('pollen');
    var ctx = cv.getContext('2d');
    var motes = [], W, H, running = true;

    function size() {
      W = cv.width = cv.offsetWidth * Math.min(devicePixelRatio || 1, 2);
      H = cv.height = cv.offsetHeight * Math.min(devicePixelRatio || 1, 2);
    }
    size();
    addEventListener('resize', size);

    var N = Math.min(160, Math.round(innerWidth * innerHeight / 14000));
    for (var i = 0; i < N; i++) {
      motes.push({
        x: Math.random(), y: Math.random(),
        r: .6 + Math.random() * 1.8,
        sp: .008 + Math.random() * .022,
        ph: Math.random() * 6.28,
        sw: 6 + Math.random() * 18,
        a: .12 + Math.random() * .4
      });
    }
    document.addEventListener('visibilitychange', function () {
      running = !document.hidden;
      if (running) tick(performance.now());
    });

    var last = 0;
    function tick(now) {
      if (!running) return;
      var dt = Math.min((now - last) / 1000, .05); last = now;
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < N; i++) {
        var m = motes[i];
        m.y -= m.sp * dt * 60 / 60 * 1.2;
        if (m.y < -.03) { m.y = 1.03; m.x = Math.random(); }
        var x = (m.x + Math.sin(now / 2600 + m.ph) * m.sw / W) * W;
        var y = m.y * H;
        var tw = .65 + .35 * Math.sin(now / 900 + m.ph * 3.1);
        ctx.beginPath();
        ctx.arc(x, y, m.r * 2, 0, 6.28);
        ctx.fillStyle = 'rgba(236,244,224,' + (m.a * tw).toFixed(3) + ')';
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
